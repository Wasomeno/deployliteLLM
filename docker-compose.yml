services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://llmproxy:${LITELLM_DB_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LLM_PROXY: "True"
      LITELLM_ADMIN_CORS_ALLOWED_ORIGINS: "*"
      # Google Cloud / Vertex AI
      GOOGLE_VERTEX_AI_PROJECT: ${GCP_PROJECT}
      GOOGLE_VERTEX_AI_LOCATION: ${GCP_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcp-service-account.json
    env_file:
      - .env
    volumes:
      - gcp-service-account:/app/credentials/gcp-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
        - "-d"
        - litellm
        - "-U"
        - llmproxy
      interval: 1s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  litellm_pgdata:
  gcp-service-account:
